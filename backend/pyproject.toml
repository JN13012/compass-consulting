[project]
name = "compass-api"
version = "0.1.0"
description = "Compass — assistant du consultant IA & Blockchain (API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "litellm>=1.55",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "types-beautifulsoup4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a real LLM provider or external API (excluded by default)",
    "db: needs the PostgreSQL database (skipped when unreachable)",
]
addopts = "-m 'not live'"
filterwarnings = ["ignore::bs4.XMLParsedAsHTMLWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["litellm.*", "pgvector.*"]
ignore_missing_imports = true
