# Rôles → modèles (format LiteLLM : "<fournisseur>/<modèle>").
# Le code demande toujours un RÔLE, jamais un modèle en dur.
# `local: true` = le modèle tourne sur la machine ; seuls ces rôles sont autorisés
# pour une mission « confidentiel ».

roles:
  reasoning:
    model: anthropic/claude-opus-5-5
    local: false
  extraction:
    model: anthropic/claude-sonnet-5-5
    local: false
  local:
    model: ollama/mistral-small
    local: true
    api_base: http://ollama:11434
  embedding:
    model: ollama/bge-m3
    local: true
    api_base: http://ollama:11434
