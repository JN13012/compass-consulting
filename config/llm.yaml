# Rôles → modèles (format LiteLLM : "<fournisseur>/<modèle>").
# Le code demande toujours un RÔLE, jamais un modèle en dur.
# `local: true` = le modèle tourne sur la machine ; seuls ces rôles sont autorisés
# pour une mission « confidentiel ».
# Les valeurs ${VAR:-défaut} sont lues dans l'environnement (.env).
#
# Fournisseur cloud : une seule clé générique AI_API_KEY ; le fournisseur est donné par le préfixe
# du modèle AI_MODEL (anthropic/…, openai/…, mistral/…, gemini/…).

roles:
  reasoning:
    model: ${AI_MODEL:-anthropic/claude-opus-5-5}
    api_key: ${AI_API_KEY:-}
    local: false
  extraction:
    model: ${AI_MODEL:-anthropic/claude-opus-5-5}
    api_key: ${AI_API_KEY:-}
    local: false
  local:
    model: ${LOCAL_MODEL:-ollama_chat/qwen3.5:9b}
    local: true
    api_base: ${OLLAMA_BASE_URL:-http://ollama:11434}
    params:
      think: false   # qwen3.5 « réfléchit » par défaut : réponse vide ou très lente sans cette option
  embedding:
    model: ${EMBEDDING_MODEL:-ollama/bge-m3}
    local: true
    api_base: ${OLLAMA_BASE_URL:-http://ollama:11434}
