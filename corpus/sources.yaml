# Sources officielles du corpus — définies à la main, jamais par l'IA.
#
# Téléchargement : API de l'Office des publications de l'UE (même texte que EUR-Lex, XHTML structuré, FR).
# Version : pour chaque texte, l'ingestion prend la DERNIÈRE VERSION CONSOLIDÉE dont la date est <= aujourd'hui
# (articles + annexes). Les considérants viennent toujours de la version d'origine (ils ne sont jamais modifiés
# et ne figurent pas dans les versions consolidées). Sans version consolidée, la version d'origine est utilisée.
#
# ⚠ Seul le Journal officiel fait foi : les versions consolidées sont des outils de documentation.
#
# Champs : code (préfixe des identifiants de passages), celex (acte d'origine), title, short, domain.

